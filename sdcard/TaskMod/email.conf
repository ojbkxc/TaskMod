# TaskMod 邮件配置
# enable_notify=true 启用邮件通知（热加载）
# 不配置或 enable_notify=false 则不加载邮件功能

enable_notify=false
smtp_server=smtp.qq.com
smtp_port=587
username=your@qq.com
password=your_auth_code
from=your@qq.com
to=recipient@example.com
subject=TaskMod 通知
body=脚本已执行完成
timeout_secs=30
max_retries=3
retry_interval=1
